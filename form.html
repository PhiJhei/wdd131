<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="author" content="Jhei Salvatierra">
    <meta name="description"
        content="Submission form sample project for products that include overall rating and written review">
    <script defer src="scripts/form.js"></script>
    <link rel="stylesheet" href="styles/form.css">
    <title>Product Review</title>
</head>

<body>
    <h1>Product Review</h1>

    <main>
        <form action="review.html" method="get">

            <div>
                <label>Product Name</label><br>
                <select id="product" name="product-name" required>
                    <option value="" disabled selected>Choose a Product ...</option>
                </select>
            </div>

            <div id="rating-grid">
                <label id="overall-header" for="rating">Overall Rating</label>

                <div class="rating-stars"><label for="one">☆</label><br>
                    <input type="radio" id="one" name="rating" value="1">
                </div>

                <div class="rating-stars"><label for="two">☆☆</label><br>
                    <input type="radio" id="two" name="rating" value="2">
                </div>

                <div class="rating-stars"><label for="three">☆☆☆</label><br>
                    <input type="radio" id="three" name="rating" value="3">
                </div>

                <div class="rating-stars">
                    <label for="four">☆☆☆☆</label><br>
                    <input type="radio" id="four" name="rating" value="4">
                </div>

                <div class="rating-stars"><label for="five">☆☆☆☆☆</label><br>
                    <input type="radio" id="five" name="rating" value="5">
                </div>
            </div>

            <div>
                <label for="installation-date">Date of Installation</label><br>
                <input type="date" id="installation-date" name="installation-date">
            </div>

            <div id="features">
                <label>Which features did you find useful in the product?<br>
                    <i>(Check all that apply)</i>
                </label>

                <br>

                <label for="durability"><input type="checkbox" id="durability" name="features" value="durability">
                    Durability</label>

                <label for="easeOfUse"><input type="checkbox" id="easeOfUse" name="features" value="easeOfUse"> Ease of
                    Use</label>

                <label for="performance"><input type="checkbox" id="performance" name="features" value="performance">
                    Performance</label>

                <label for="design"><input type="checkbox" id="design" name="features" value="design"> Design</label>
            </div>

            <div>
                <label for="review-field">Written Review <small>(Optional)</small></label>
                <textarea name="review-field" id="review-field"></textarea>
            </div>

            <div>
                <label for="name-field">Your Name <small>(Optional)</small></label>
                <textarea name="name-field" id="name-field"></textarea>
            </div>

            <div>
                <input type="submit" value="Post Review">
            </div>

        </form>

    </main>
</body>
<footer>
    <p>©<span id="currentyear"></span> Jhei Salvatierra Philippines</p>
    <p id="lastModified"></p>
</footer>

</html>
